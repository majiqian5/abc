name: Build Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git build-essential fakeroot libxml2-dev libssl-dev zlib1g-dev curl xz-utils

      - name: Install Theos (official installer)
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          ls $THEOS/toolchain/linux/iphone/bin/clang

      - name: Install iOS SDK
        run: |
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git sdk-repo
          for sdk in sdk-repo/iPhoneOS16.*.sdk; do
            if [ -d "$sdk" ]; then
              cp -r "$sdk" $THEOS/sdks/
              echo "Using SDK: $sdk"
              break
            fi
          done
          ls $THEOS/sdks

      - name: Fix Makefile SDK version
        run: |
          SDK_VERSION=$(ls $THEOS/sdks | grep -o '16\.[0-9]*' | head -1)
          echo "Detected SDK version: $SDK_VERSION"
          sed -i "s/iphone:clang:16\.[0-9]*:/iphone:clang:${SDK_VERSION}:/" Makefile
          head -5 Makefile

      - name: Build (Rootless)
        run: |
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
        env:
          THEOS: ${{ env.THEOS }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCClockModule
          path: packages/*.deb
