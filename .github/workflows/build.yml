name: Build Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git build-essential fakeroot libxml2-dev libssl-dev zlib1g-dev
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Install iOS SDK
        run: |
          curl -L -o iPhoneOS.sdk.tar.xz "https://github.com/xybp888/iOS-SDKs/releases/download/iOS-SDKs/iPhoneOS16.5.sdk.tar.xz"
          mkdir -p $THEOS/sdks
          tar -xf iPhoneOS.sdk.tar.xz -C $THEOS/sdks
          ls $THEOS/sdks

      - name: Build (Rootless)
        run: |
          export THEOS=$THEOS
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCClockModule
          path: packages/*.deb
