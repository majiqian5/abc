            
name: build-weatherlock
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/weather.yml'
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest sources (always from CDN)
        run: |
          set -e
          mkdir -p src tools
          curl -fsSL "https://aka.doubaocdn.com/s/kFVBcvvDqV" -o src/AxsWeatherLock.m
          curl -fsSL "https://aka.doubaocdn.com/s/WWw12JHszz" -o src/WeatherLockPrefs.m
          curl -fsSL "https://aka.doubaocdn.com/s/1OfrNrPxc2" -o tools/make_prefs.py
          wc -l src/AxsWeatherLock.m src/WeatherLockPrefs.m tools/make_prefs.py
          grep -c "CSCoverSheetViewController" src/AxsWeatherLock.m; grep -c "chrome" src/AxsWeatherLock.m
          grep -c "setRootController" src/WeatherLockPrefs.m; grep -c "wlLog" src/WeatherLockPrefs.m
      - name: Compile fat arm64 plus arm64e
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          rm -rf out; mkdir -p out/WeatherLockPrefs.bundle
          for ARCH in arm64 arm64e; do
            xcrun --sdk iphoneos clang -target ${ARCH}-apple-ios15.0 \
              -isysroot "$SDK" -dynamiclib -O2 -fobjc-arc \
              -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore \
              -install_name /var/jb/Library/MobileSubstrate/DynamicLibraries/AxsWeatherLock.dylib \
              -o out/AxsWeatherLock.$ARCH src/AxsWeatherLock.m
            xcrun --sdk iphoneos clang -target ${ARCH}-apple-ios15.0 \
              -isysroot "$SDK" -bundle -O2 -fobjc-arc \
              -framework UIKit -framework Foundation -framework CoreFoundation \
              -Wl,-undefined,dynamic_lookup \
              -o out/WeatherLockPrefs.bundle/WeatherLockPrefs.$ARCH src/WeatherLockPrefs.m
          done
          xcrun lipo -create -output out/AxsWeatherLock.dylib out/AxsWeatherLock.arm64 out/AxsWeatherLock.arm64e
          xcrun lipo -create -output out/WeatherLockPrefs.bundle/WeatherLockPrefs \
            out/WeatherLockPrefs.bundle/WeatherLockPrefs.arm64 out/WeatherLockPrefs.bundle/WeatherLockPrefs.arm64e
          rm -f out/AxsWeatherLock.arm64 out/AxsWeatherLock.arm64e \
                out/WeatherLockPrefs.bundle/WeatherLockPrefs.arm64 out/WeatherLockPrefs.bundle/WeatherLockPrefs.arm64e
          xcrun lipo -info out/AxsWeatherLock.dylib
          xcrun lipo -info out/WeatherLockPrefs.bundle/WeatherLockPrefs
          otool -L out/WeatherLockPrefs.bundle/WeatherLockPrefs | head -6
      - name: Make bundle plists
        run: |
          set -e
          python3 tools/make_prefs.py out
          ls -R out
      - name: Sign
        run: |
          brew install ldid >/dev/null 2>&1 || true
          for f in out/AxsWeatherLock.dylib out/WeatherLockPrefs.bundle/WeatherLockPrefs; do
            ldid -S "$f" || codesign -s - -f "$f"
          done
      - name: Upload
        run: |
          cd out && zip -qr weatherlock-arm64e.zip AxsWeatherLock.dylib WeatherLockPrefs.bundle WeatherLock.plist
      - uses: actions/upload-artifact@v4
        with:
          name: weatherlock-arm64e
          path: out/weatherlock-arm64e.zip

        
