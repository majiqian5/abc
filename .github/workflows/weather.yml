name: build-weatherlock
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/weather.yml'
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sources
        run: |
          set -e
          mkdir -p src tools
          T=$(find . -maxdepth 4 -name "AxsWeatherLock.m" | head -1)
          if [ -z "$T" ]; then
            curl -fsSL "https://aka.doubaocdn.com/s/hbXKUHkwFi" -o src/AxsWeatherLock.m
            T=src/AxsWeatherLock.m
          fi
          P=$(find . -maxdepth 4 -name "WeatherLockPrefs.m" | head -1)
          if [ -z "$P" ]; then
            curl -fsSL "https://aka.doubaocdn.com/s/M3rA7pI9mg" -o src/WeatherLockPrefs.m
            P=src/WeatherLockPrefs.m
          fi
          [ -f tools/make_prefs.py ] || curl -fsSL "https://aka.doubaocdn.com/s/uZXxefEsH1" -o tools/make_prefs.py
          echo "tweak=$T"; echo "prefs=$P"
          wc -l "$T" "$P" tools/make_prefs.py
      - name: Compile
        run: |
          set -e
          T=$(find . -maxdepth 4 -name "AxsWeatherLock.m" | head -1)
          P=$(find . -maxdepth 4 -name "WeatherLockPrefs.m" | head -1)
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          rm -rf out; mkdir -p out/WeatherLockPrefs.bundle
          xcrun --sdk iphoneos clang -target arm64e-apple-ios15.0 \
            -isysroot "$SDK" -dynamiclib -O2 -fobjc-arc \
            -framework UIKit -framework Foundation \
            -framework CoreGraphics -framework QuartzCore \
            -install_name /var/jb/Library/MobileSubstrate/DynamicLibraries/AxsWeatherLock.dylib \
            -o out/AxsWeatherLock.dylib "$T"
          xcrun --sdk iphoneos clang -target arm64e-apple-ios15.0 \
            -isysroot "$SDK" -bundle -O2 -fobjc-arc \
            -framework UIKit -framework Foundation \
            -Wl,-undefined,dynamic_lookup \
            -o out/WeatherLockPrefs.bundle/WeatherLockPrefs "$P"
          otool -hv out/AxsWeatherLock.dylib | head -4
          otool -hv out/WeatherLockPrefs.bundle/WeatherLockPrefs | head -4
      - name: Make bundle plists
        run: |
          set -e
          python3 tools/make_prefs.py out
          ls -R out
      - name: Sign
        run: |
          brew install ldid >/dev/null 2>&1 || true
          for f in out/AxsWeatherLock.dylib out/WeatherLockPrefs.bundle/WeatherLockPrefs; do
            ldid -S "$f" || codesign -s - -f "$f"
          done
      - name: Upload
        run: |
          cd out && zip -qr weatherlock-arm64e.zip AxsWeatherLock.dylib WeatherLockPrefs.bundle WeatherLock.plist
      - uses: actions/upload-artifact@v4
        with:
          name: weatherlock-arm64e
          path: out/weatherlock-arm64e.zip

        
