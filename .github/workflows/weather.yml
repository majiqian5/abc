name: build-weatherlock
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/AxsWeatherLock.m'
      - 'AxsWeatherLock.m'
      - '.github/workflows/weather.yml'
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64e dylib
        run: |
          set -e
          echo "== repo .m files =="
          find . -name "*.m" -maxdepth 4 -print || true
          SRC=$(find . -name "AxsWeatherLock.m" | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::AxsWeatherLock.m not found in repo"
            exit 1
          fi
          echo "using: $SRC"
          wc -l "$SRC"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p out
          xcrun --sdk iphoneos clang -target arm64e-apple-ios15.0 \
            -isysroot "$SDK" -dynamiclib -O2 -fobjc-arc \
            -framework UIKit -framework Foundation \
            -framework CoreGraphics -framework QuartzCore -framework CoreText \
            -install_name /var/jb/Library/MobileSubstrate/DynamicLibraries/AxsWeatherLock.dylib \
            -o out/AxsWeatherLock.dylib "$SRC"
          otool -hv out/AxsWeatherLock.dylib | head -4
          lipo -info out/AxsWeatherLock.dylib
      - name: Sign
        run: |
          brew install ldid >/dev/null 2>&1 || true
          ldid -S out/AxsWeatherLock.dylib || codesign -s - -f out/AxsWeatherLock.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: weatherlock-arm64e
          path: out/AxsWeatherLock.dylib

        
